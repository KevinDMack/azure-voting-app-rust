apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-keyvault-secrets                 # This needs to be unique per namespace
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: 7af21f6d-1280-4ffc-a888-6ab1f9bd01a4     # Setting this to use workload identity
    keyvaultName: aks-voting-kv                  # Set to the name of your key vault
    objects:  |
      array:
        - |
          objectName: database-user            # The name of the secret in the key vault
          objectType: secret                   # The type of the secret in the key vault
        - |
          objectName: database-password
          objectType: secret
    tenantId: "03f141f3-496d-4319-bbea-a3e9286cab10"                   # The tenant ID of the key vault
    cloudName: "AzureUSGovernment"